[project]
name = "jarvis"
version = "0.1.0"
description = "A local, modular AI assistant powered by Ollama — JARVIS v0.1"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LLM abstraction — lets us swap providers without touching app code
    "litellm>=1.40.0",
    # Type-safe config & secrets loading from .env
    "pydantic-settings>=2.3.0",
    # DuckDuckGo search — free, no API key (package renamed from duckduckgo-search to ddgs)
    "ddgs>=9.0.0",
    # Structured JSON logging
    "structlog>=24.1.0",
    # Rich terminal output (colours, spinners, panels)
    "rich>=13.7.0",
    # .env file loading (pulled in by pydantic-settings, explicit for clarity)
    "python-dotenv>=1.0.0",
    # Local vector DB for long-term memory (v0.2 RAG)
    "chromadb>=0.5.0",
    # Local embeddings for Chroma (no paid API)
    "sentence-transformers>=3.0.0",
    # Voice I/O (v0.4) — local STT + free Edge TTS
    "openai-whisper>=20231117",
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "playsound==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
# After `uv pip install -e .`, running `jarvis` starts the assistant
jarvis = "jarvis.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
